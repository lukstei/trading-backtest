plugins {
    id 'java'
    id 'application'
}

group = 'org.lst.trading'
version = '1.2'

repositories {
    mavenCentral()
}

dependencies {
    // math
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'org.la4j:la4j:0.6.0'

    // util
    implementation 'io.reactivex:rxjava:1.3.8'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'

    // logging
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'ch.qos.logback:logback-classic:1.2.13'

    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'org.lst.trading.main.BacktestMain'
}

// pass -Dalphavantantage.apikey through to the app
tasks.named('run') {
    def apiKey = providers.systemProperty('alphavantantage.apikey')
    if (apiKey.isPresent()) {
        systemProperty 'alphavantantage.apikey', apiKey.get()
    }
}
